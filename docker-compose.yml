services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-order_db}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    command:
      [
        'sh',
        '-c',
        'rabbitmq-plugins enable --offline rabbitmq_prometheus && exec rabbitmq-server',
      ]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${MYSQL_DATABASE:-order_db}
    command: ['npm', 'run', 'migration:run']
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-}
      JWKS_CACHE_TTL_MS: ${JWKS_CACHE_TTL_MS:-600000}
      JWKS_TIMEOUT_MS: ${JWKS_TIMEOUT_MS:-3000}
      JWKS_RATE_LIMIT: ${JWKS_RATE_LIMIT:-10}
      PORT: 3000
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${MYSQL_DATABASE:-order_db}
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_SERVICE_NAME: order-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const net=require('node:net');const socket=net.connect(3000,'127.0.0.1',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  mysql-test:
    image: mysql:8.0
    profiles: ['test']
    command: ['--innodb-lock-wait-timeout=1']
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      MYSQL_DATABASE: order_db_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -ptestroot --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq-test:
    image: rabbitmq:3.13-management
    profiles: ['test']
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  test:
    profiles: ['test']
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      AUTH_ENABLED: 'false'
      DB_TYPE: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_USERNAME: test
      DB_PASSWORD: test
      DB_NAME: order_db_test
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://test:test@rabbitmq-test:5672
    command:
      [
        'sh',
        '-c',
        'npm run lint && npm run build && npm run migration:run:dev && npm test -- --runInBand && npm run test:acceptance -- --runInBand',
      ]
    depends_on:
      mysql-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ['observability']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ['observability']
    command: ['-config.file=/etc/tempo/tempo.yml']
    ports:
      - '127.0.0.1:3200:3200'
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:3.3.2
    profiles: ['observability']
    command: ['-config.file=/etc/loki/loki.yml']
    ports:
      - '127.0.0.1:3101:3100'
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ['observability']
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '/etc/alloy/config.alloy'
    environment:
      DOCKER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-order-api}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Alloy discovers only this Compose project's API container.
      # This Docker socket grants elevated control of the local Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: ['observability']
    command: ['--config=/etc/otelcol-contrib/config.yml']
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ['observability']
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  mysql_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  alloy_data:

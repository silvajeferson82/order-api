services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-order_db}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${MYSQL_DATABASE:-order_db}
    command: ['npm', 'run', 'migration:run']
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${MYSQL_DATABASE:-order_db}
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  mysql-test:
    image: mysql:8.0
    profiles: ['test']
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      MYSQL_DATABASE: order_db_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -ptestroot --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  test:
    profiles: ['test']
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      DB_TYPE: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_USERNAME: test
      DB_PASSWORD: test
      DB_NAME: order_db_test
      RABBITMQ_ENABLED: 'false'
      NODE_OPTIONS: --experimental-require-module
    command:
      ['sh', '-c', 'npm run lint && npm run build && npm test -- --runInBand']
    depends_on:
      mysql-test:
        condition: service_healthy

volumes:
  mysql_data:
  rabbitmq_data:
  mysql_test_data:

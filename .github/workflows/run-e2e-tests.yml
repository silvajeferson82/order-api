name: E2E tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-e2e:
    name: HTTP E2E (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run HTTP E2E tests
        run: npm run test:e2e -- --runInBand

  mysql-rabbitmq-acceptance:
    name: Acceptance (MySQL + RabbitMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run isolated Compose acceptance suite
        run: docker compose version && npm run test:acceptance:compose

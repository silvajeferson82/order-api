services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-order_db}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${MYSQL_DATABASE:-order_db}
    command: ['npm', 'run', 'migration:run']
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-}
      JWKS_CACHE_TTL_MS: ${JWKS_CACHE_TTL_MS:-600000}
      JWKS_TIMEOUT_MS: ${JWKS_TIMEOUT_MS:-3000}
      JWKS_RATE_LIMIT: ${JWKS_RATE_LIMIT:-10}
      PORT: 3000
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${MYSQL_DATABASE:-order_db}
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const net=require('node:net');const socket=net.connect(3000,'127.0.0.1',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  mysql-test:
    image: mysql:8.0
    profiles: ['test']
    command: ['--innodb-lock-wait-timeout=1']
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      MYSQL_DATABASE: order_db_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -ptestroot --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq-test:
    image: rabbitmq:3.13-management
    profiles: ['test']
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  test:
    profiles: ['test']
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      AUTH_ENABLED: 'false'
      DB_TYPE: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_USERNAME: test
      DB_PASSWORD: test
      DB_NAME: order_db_test
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://test:test@rabbitmq-test:5672
    command:
      [
        'sh',
        '-c',
        'npm run lint && npm run build && npm run migration:run:dev && npm test -- --runInBand && npm run test:acceptance -- --runInBand',
      ]
    depends_on:
      mysql-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy

volumes:
  mysql_data:
  rabbitmq_data:
